server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the server container; keep the /api prefix intact.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Push-to-talk events (SSE): disable buffering so press/release reach the
    # browser immediately instead of sitting in nginx's response buffer.
    location /api/ptt/stream {
        proxy_pass http://server:4000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # react-router (BrowserRouter): let the client handle /admin, /jarvis, etc.
    location / {
        try_files $uri /index.html;
    }
}
